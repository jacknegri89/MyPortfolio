<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina non trovata · Giacomo Negri</title>
<style>
  :root { --bg: #04050a; --fg: #f3f5fb; --muted: #8e95ac; --a2: #63bdff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; }
  p.code { margin: 0 0 8px; color: var(--a2); font-family: ui-monospace, Consolas, monospace; }
  h1 { margin: 0 0 14px; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.1; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
  a { color: var(--bg); background: var(--a2); padding: 12px 20px; border-radius: 999px; text-decoration: none; font-weight: 600; }
  a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Questa pagina non esiste.</h1>
  <p>Il link potrebbe essere sbagliato o la pagina è stata spostata. Il portfolio è tutto nella pagina iniziale.</p>
  <a href="/">Torna al portfolio</a>
</main>
</body>
</html>
